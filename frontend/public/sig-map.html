<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OncoTrack - SIG Map</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet.draw -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
        :root {
            --primary-navy: #0f172a;
            --muted-slate: #64748b;
            --border-light: #e2e8f0;
            --bg-light: #f8fafc;
            --accent-blue: #3b82f6;
            
            --risk-low: #22c55e;
            --risk-med: #f59e0b;
            --risk-high: #f97316;
            --risk-crit: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--primary-navy);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 380px;
            background-color: #ffffff;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-light);
            z-index: 1000;
            box-shadow: 4px 0 15px rgba(0,0,0,0.02);
        }
        
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-navy);
            font-family: 'Outfit', sans-serif;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* Sections */
        .section {
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .section-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background: #fcfcfd;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted-slate);
            border-bottom: 1px solid var(--border-light);
        }
        .section-header:hover {
            background: #f8fafc;
        }
        .section-header.active {
            color: var(--primary-navy);
        }
        .section-header.active .chevron {
            transform: rotate(180deg);
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chevron {
            transition: transform 0.2s ease;
            width: 14px;
            height: 14px;
        }

        .section-content {
            padding: 16px;
            display: none;
        }
        .section-content.open {
            display: block;
        }

        /* Drawing Mode Grid */
        .draw-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn-draw {
            background: #ffffff;
            border: 1px solid var(--border-light);
            padding: 12px;
            border-radius: 10px;
            color: var(--muted-slate);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-draw:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: #f0f7ff;
        }
        .btn-draw.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            fontWeight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border-light);
            background: white;
            color: var(--primary-navy);
        }
        .btn:hover {
            background: #f8fafc;
        }
        
        .btn-primary {
            background: var(--accent-blue);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: none;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-layer {
            width: 100%;
            margin-bottom: 8px;
            justify-content: flex-start;
        }
        .btn-layer.active {
            background: #eff6ff;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            color: var(--muted-slate);
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-light);
            color: var(--primary-navy);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--accent-blue);
        }
        
        /* Map */
        #map-container {
            flex: 1;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #f1f5f9;
        }

        /* Floating UI Elements */
        .floating-pill {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--accent-blue);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .floating-pill.visible {
            opacity: 1;
            visibility: visible;
        }

        .info-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            width: 340px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transform: translateY(20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .info-panel.visible {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        /* Summary Card */
        .summary-card {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 16px;
            width: 260px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .summary-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted-slate);
            margin-bottom: 12px;
            font-weight: 800;
        }
        .summary-stat {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-navy);
        }
        .stat-label {
            font-size: 13px;
            color: var(--muted-slate);
        }

        /* Legend Panel */
        .legend-card {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 14px;
            width: 220px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: none;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-navy);
        }
        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Risk Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .badge-low { background: #dcfce7; color: #166534; }
        .badge-med { background: #fef3c7; color: #92400e; }
        .badge-high { background: #ffedd5; color: #9a3412; }
        .badge-crit { background: #fee2e2; color: #991b1b; }

        /* Zone List Cards */
        .zone-card {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .zone-card:hover {
            background: #f8fafc;
            border-color: var(--accent-blue);
        }
        .zone-card.active {
            background: #eff6ff;
            border-color: var(--accent-blue);
        }
        .zone-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .zone-title {
            font-weight: 700;
            font-size: 13px;
            color: var(--primary-navy);
        }
        .zone-loc {
            font-size: 11px;
            color: var(--muted-slate);
        }

        /* Prof Correlation */
        .prof-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border-light);
        }
        .prof-score {
            color: var(--accent-blue);
            font-weight: 800;
        }

        /* Multi-select styling */
        .multi-select-container {
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 8px;
        }
        .multi-select-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 12px;
            cursor: pointer;
        }
        .multi-select-item input {
            cursor: pointer;
        }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <span>OncoTrack SIG</span>
            <i data-lucide="map"></i>
        </div>
        
        <div class="scroll-area">
            <!-- Layers Toggle -->
            <div class="section">
                <div class="section-header active" onclick="toggleSection(this)">
                    <div class="section-title"><i data-lucide="layers"></i> Couches de données</div>
                    <i data-lucide="chevron-down" class="chevron"></i>
                </div>
                <div class="section-content open">
                    <button class="btn btn-layer active" id="layer-cancer" onclick="toggleLayer('cancer')">
                        <i data-lucide="circle-dot"></i> Cas de Cancer
                    </button>
                    <button class="btn btn-layer active" id="layer-risk" onclick="toggleLayer('risk')">
                        <i data-lucide="alert-triangle"></i> Zones à Risque
                    </button>
                    <button class="btn btn-layer" id="layer-profession" onclick="toggleLayer('profession')">
                        <i data-lucide="users"></i> Professions (Dots)
                    </button>
                    <button class="btn btn-layer" id="layer-fusion" onclick="toggleLayer('fusion')">
                        <i data-lucide="zap"></i> Mode Fusion
                    </button>
                </div>
            </div>

            <!-- Drawing -->
            <div class="section">
                <div class="section-header active" onclick="toggleSection(this)">
                    <div class="section-title"><i data-lucide="edit-3"></i> Dessiner une Zone</div>
                    <i data-lucide="chevron-down" class="chevron"></i>
                </div>
                <div class="section-content open">
                    <div class="draw-grid">
                        <button class="btn-draw" id="draw-polygon" onclick="setDrawMode('polygon')">
                            <i data-lucide="pentagon"></i>
                            <span>Polygone</span>
                        </button>
                        <button class="btn-draw" id="draw-rectangle" onclick="setDrawMode('rectangle')">
                            <i data-lucide="square"></i>
                            <span>Rectangle</span>
                        </button>
                        <button class="btn-draw" id="draw-circle" onclick="setDrawMode('circle')">
                            <i data-lucide="circle"></i>
                            <span>Cercle</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="section">
                <div class="section-header active" onclick="toggleSection(this)">
                    <div class="section-title"><i data-lucide="filter"></i> Filtres Épidémio</div>
                    <i data-lucide="chevron-down" class="chevron"></i>
                </div>
                <div class="section-content open">
                    <div class="form-group">
                        <label class="form-label">Type de Cancer</label>
                        <select class="form-control" id="f-type" onchange="applyFilters()">
                            <option value="all">Tous les cancers</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Profession (Filtrage Patient)</label>
                        <select class="form-control" id="f-profession" onchange="onProfessionFilterChange()">
                            <option value="all">Toutes les professions</option>
                        </select>
                        <div id="selected-professions-pills" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px;"></div>
                    </div>
                </div>
            </div>

            <!-- Registered Zones -->
            <div class="section">
                <div class="section-header active" onclick="toggleSection(this)">
                    <div class="section-title"><i data-lucide="list"></i> Zones Enregistrées</div>
                    <i data-lucide="chevron-down" class="chevron"></i>
                </div>
                <div class="section-content open" id="zone-list-container"></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary" style="flex: 1;" onclick="exportData('geojson')">
                    <i data-lucide="download"></i> Export
                </button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="location.reload()">
                    <i data-lucide="refresh-cw"></i> Actualiser
                </button>
            </div>
        </div>
    </aside>

    <main id="map-container">
        <div id="map"></div>
        
        <!-- Summary Card -->
        <div class="summary-card" id="summary-card">
            <div class="summary-title">Analyse Filtrée</div>
            <div class="summary-stat">
                <span class="stat-value" id="count-cases">0</span>
                <span class="stat-label">cas</span>
            </div>
            <div class="summary-stat">
                <span class="stat-value" id="count-zones">0</span>
                <span class="stat-label">zones à risque</span>
            </div>
        </div>

        <!-- Legend Panel -->
        <div class="legend-card" id="legend-card">
            <div class="summary-title">Professions affichées</div>
            <div id="legend-items"></div>
            <button class="btn btn-secondary" style="width: 100%; margin-top: 10px; font-size: 11px;" onclick="hideProfessions()">Masquer les points</button>
        </div>

        <!-- Drawing Pill (Feature 1) -->
        <div class="floating-pill" id="drawing-pill">
            <i data-lucide="pen-tool"></i>
            <span>Mode dessin actif — Double-clic pour terminer</span>
        </div>

        <!-- Info Panel -->
        <div class="info-panel" id="info-panel">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                <div>
                    <div class="info-title" id="ip-title">Zone d'exposition</div>
                    <div class="info-subtitle" id="ip-loc">Wilaya 16, Alger</div>
                </div>
                <div id="ip-badge"></div>
            </div>
            
            <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
                <div style="font-size: 0.7rem; text-transform: uppercase; color: #64748b; margin-bottom: 8px; font-weight: 700;">Corrélations Professionnelles</div>
                <div id="profession-correlations" class="profession-list">
                    <!-- Dynamic -->
                </div>
            </div>

            <div style="font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px;" id="ip-notes">
                Notes de la zone...
            </div>

            <div style="display: flex; gap: 8px;">
                <button class="btn btn-primary" style="flex: 1; margin-bottom: 0;" onclick="editSelectedZone()">Modifier</button>
                <button class="btn" style="width: 50px; margin-bottom: 0; color: #ef4444;" onclick="deleteSelectedZone()"><i data-lucide="trash-2"></i></button>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="zone-modal" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="background: #ffffff; width: 450px; padding: 32px; border-radius: 16px; border: 1px solid var(--border-light); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);">
            <h3 style="margin-bottom: 24px; font-weight: 800; display: flex; align-items: center; gap: 12px; color: var(--primary-navy);">
                <i data-lucide="plus-circle" style="color: var(--accent-blue);"></i> Détails de la Zone
            </h3>
            <form id="zone-details-form" onsubmit="handleZoneFormSubmit(event)">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label class="form-label">Nom de la Zone</label>
                    <input type="text" id="z-name" class="form-control" required placeholder="Ex: Zone Industrielle Skikda">
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Wilaya</label>
                        <select id="z-wilaya" class="form-control" required onchange="onWilayaChange(this.value)"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ville / Commune</label>
                        <select id="z-city" class="form-control" required>
                            <option value="">Choisir wilaya d'abord</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Type de Zone</label>
                        <select id="z-type" class="form-control">
                            <option value="industrial">Zone industrielle</option>
                            <option value="agricole">Zone agricole / pesticides</option>
                            <option value="coastal">Zone côtière / eau de mer</option>
                            <option value="solar">Exposition solaire</option>
                            <option value="chemical">Zone chimique / pollution</option>
                            <option value="radiation">Radiation / Nucléaire</option>
                            <option value="food">Industrie alimentaire</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Niveau de Risque</label>
                        <select id="z-level" class="form-control">
                            <option value="low">Faible</option>
                            <option value="med">Moyen</option>
                            <option value="high">Élevé</option>
                            <option value="crit">Critique</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Profession Liée (Exposition)</label>
                    <div class="multi-select-container" id="modal-prof-list">
                        <!-- Dynamic -->
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Notes / Observations</label>
                    <textarea id="z-notes" class="form-control" style="height: 60px; resize: none;"></textarea>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn" style="flex: 1;" onclick="closeZoneModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary" style="flex: 2;">Enregistrer la Zone</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let map, cancerLayerGroup, riskLayerGroup, professionLayerGroup, correlationLayerGroup;
        let appMode = 'view';
        let drawControl, drawnItems;
        let currentDrawMode = null;
        let activeLayers = { cancer: true, risk: true, profession: false, fusion: false };
        
        let patients = [];
        let zones = [];
        let activeZoneId = null;
        let markers = {};
        let selectedProfessions = [];

        const riskColors = { low: '#22c55e', med: '#f59e0b', high: '#f97316', crit: '#ef4444' };
        const riskLabels = { low: 'Faible', med: 'Moyen', high: 'Élevé', crit: 'Critique' };
        const typeLabels = {
            'industrial': 'Zone industrielle',
            'agricole': 'Zone agricole / pesticides',
            'coastal': 'Zone côtière / eau de mer',
            'solar': 'Exposition solaire',
            'chemical': 'Zone chimique / pollution',
            'radiation': 'Radiation / Nucléaire',
            'food': 'Industrie alimentaire',
            'autre': 'Autre'
        };

        const PROFESSION_COLORS = {
            'Agriculteur / Ouvrier agricole': '#10b981',
            'Ouvrier industriel / Usine':     '#f97316',
            'Mineur / Extraction':            '#78716c',
            'Pêcheur / Maritime':             '#0ea5e9',
            'Enseignant / Éducation':         '#8b5cf6',
            'Personnel de santé':             '#ec4899',
            'Informatique / Bureautique':     '#6366f1',
            'Commerce / Vente':               '#f59e0b',
            'Artisan / Menuisier / Forgeron': '#a16207',
            'Chauffeur / Transport':          '#14b8a6',
            'Fonctionnaire / Administration': '#64748b',
            'Militaire / Police':             '#1e40af',
            'Retraité':                       '#9ca3af',
            'Sans emploi / Chômeur':          '#d1d5db',
        };

        const WILAYA_COORDS = {
            "Adrar": [27.87, 0.28], "Chlef": [36.16, 1.33], "Laghouat": [33.8, 2.87],
            "Oum El Bouaghi": [35.87, 7.11], "Batna": [35.556, 6.174], "Béjaïa": [36.752, 5.056],

        const WILAYA_CITIES_FALLBACK = {
            "Alger": ["Alger Centre", "Bab El Oued", "El Biar", "Hydra", "Kouba", "Zeralda", "Sidi Abdellah"],
            "Oran": ["Oran", "Arzew", "Bir El Djir", "Es Senia", "Ain El Turk"],
            "Constantine": ["Constantine", "El Khroub", "Hamma Bouziane", "Zighoud Youcef"],
            "Tlemcen": ["Tlemcen", "Maghnia", "Mansourah", "Remchi", "Ghazaouet"]

        async function initMap() {
            map = L.map('map', {zoomControl: false, maxBounds: [[18, -10], [38, 15]]}).setView([36.0, 3.0], 7);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            cancerLayerGroup = L.layerGroup().addTo(map);
            riskLayerGroup = L.layerGroup().addTo(map);
            professionLayerGroup = L.layerGroup().addTo(map);
            correlationLayerGroup = L.layerGroup().addTo(map);
            drawnItems = L.featureGroup().addTo(map);

            drawControl = new L.Control.Draw({
                edit: { featureGroup: drawnItems, remove: false },
                draw: { polyline: false, marker: false, circlemarker: false }
            });
            
            map.on(L.Draw.Event.CREATED, async function (e) {
                const layer = e.layer;
                drawnItems.addLayer(layer);
                
                let shapeData = { type: e.layerType };
                let center;
                if (e.layerType === 'circle') {
                    center = layer.getLatLng();
                    shapeData.lat = center.lat;
                    shapeData.lng = center.lng;
                    shapeData.radius = layer.getRadius();
                } else if (e.layerType === 'rectangle') {
                    center = layer.getBounds().getCenter();
                    shapeData.bounds = layer.getBounds();
                } else {
                    center = layer.getBounds().getCenter();
                    shapeData.latlngs = layer.getLatLngs();
                }
                
                // Detect wilaya from center
                const wilaya = detectWilaya(center);
                openZoneModal(shapeData, wilaya);
                setDrawMode(null);
            });

            await fetchData();
            loadZones();
            renderAll();
        }

        async function fetchData() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert("Session expirée. Veuillez vous reconnecter.");
                window.location.href = "/login";
                return;
            }

            try {
                const res = await fetch('/api/patients?limit=10000', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 401) {
                    alert("Session expirée. Veuillez vous reconnecter.");
                    window.location.href = "/login";
                    return;
                }

                const data = await res.json();
                patients = data.patients || [];
                
                // Populate Filters
                const profs = [...new Set(patients.map(p => p.profession).filter(Boolean))].sort();
                const types = [...new Set(patients.map(p => p.cancer_type).filter(Boolean))].sort();
                
                const fProf = document.getElementById('f-profession');
                profs.forEach(p => fProf.add(new Option(p, p)));

                const fType = document.getElementById('f-type');
                types.forEach(t => fType.add(new Option(t, t)));
                
                // Profession multi-select in modal
                const modalProfContainer = document.getElementById('modal-prof-list');
                modalProfContainer.innerHTML = '';
                profs.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'multi-select-item';
                    div.innerHTML = `<input type="checkbox" name="linked_profs" value="${p}"> <span>${p}</span>`;
                    modalProfContainer.appendChild(div);
                });

            } catch (e) { console.error("Fetch Error:", e); }
        }

        function detectWilaya(latlng) {
            let nearest = "Alger";
            let minDist = Infinity;
            for (const [w, coords] of Object.entries(WILAYA_COORDS)) {
                const d = Math.sqrt(Math.pow(latlng.lat - coords[0], 2) + Math.pow(latlng.lng - coords[1], 2));
                if (d < minDist) { minDist = d; nearest = w; }
            }
            return nearest;
        }

        function renderAll() {
            renderCancerPoints();
            renderRiskZones();
            renderProfessionDots();
            renderCorrelations();
            updateSummary();
        }

        function renderCancerPoints() {
            cancerLayerGroup.clearLayers();
            if (!activeLayers.cancer) return;

            const selectedType = document.getElementById('f-type').value;
            
            // Group by Wilaya
            const wilayaStats = {};
            patients.forEach(p => {
                if (selectedType !== 'all' && p.cancer_type !== selectedType) return;
                if (!p.wilaya) return;
                if (!wilayaStats[p.wilaya]) wilayaStats[p.wilaya] = 0;
                wilayaStats[p.wilaya]++;
            });

            for (const [w, count] of Object.entries(wilayaStats)) {
                const coords = WILAYA_COORDS[w];
                if (!coords) continue;
                
                const radius = 8 + Math.sqrt(count) * 2;
                const circle = L.circleMarker(coords, {
                    radius: radius,
                    fillColor: '#ec4899',
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 0.6
                });
                
                circle.bindTooltip(`<strong>Wilaya: ${w}</strong><br>${count} patients`, { direction: 'top' });
                circle.addTo(cancerLayerGroup);
            }
        }

        function renderProfessionDots() {
            professionLayerGroup.clearLayers();
            if (!activeLayers.profession || selectedProfessions.length === 0) {
                document.getElementById('legend-card').style.display = 'none';
                return;
            }

            document.getElementById('legend-card').style.display = 'block';
            const legendItems = document.getElementById('legend-items');
            legendItems.innerHTML = '';
            
            selectedProfessions.forEach(prof => {
                const color = PROFESSION_COLORS[prof] || '#64748b';
                legendItems.innerHTML += `<div class="legend-item"><div class="legend-color" style="background:${color}"></div> ${prof}</div>`;

                // Calculate stats per wilaya
                const stats = {};
                patients.forEach(p => {
                    if (p.profession !== prof || !p.wilaya) return;
                    if (!stats[p.wilaya]) stats[p.wilaya] = { count: 0, ages: [], sex: {M:0, F:0}, cancers: {} };
                    const s = stats[p.wilaya];
                    s.count++;
                    if (p.age) s.ages.push(p.age);
                    if (p.sexe) s.sex[p.sexe]++;
                    if (p.cancer_type) s.cancers[p.cancer_type] = (s.cancers[p.cancer_type] || 0) + 1;
                });

                for (const [w, s] of Object.entries(stats)) {
                    const coords = WILAYA_COORDS[w];
                    if (!coords) continue;

                    // Offset slightly if multiple professions
                    const offset = selectedProfessions.indexOf(prof) * 0.05;
                    const pos = [coords[0] + offset, coords[1] + offset];

                    const icon = L.divIcon({
                        className: '',
                        html: `<div style="width:30px; height:30px; background:${color}; border-radius:50%; border:2px solid white; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:10px; box-shadow:0 2px 8px rgba(0,0,0,0.2)">${s.count}</div>`,
                        iconSize: [30, 30]
                    });

                    const marker = L.marker(pos, { icon: icon });
                    
                    const avgAge = s.ages.length ? Math.round(s.ages.reduce((a,b)=>a+b, 0) / s.ages.length) : '—';
                    const mainCancer = Object.entries(s.cancers).sort((a,b)=>b[1]-a[1])[0]?.[0] || '—';

                    marker.bindTooltip(`
                        <div style="font-family:'Inter'">
                            <strong style="color:${color}">${w} — ${prof}</strong><br>
                            <div style="border-top:1px solid #eee; margin:5px 0; padding-top:5px">
                                <strong>${s.count} patients</strong><br>
                                ${s.sex.F} femmes · ${s.sex.M} hommes<br>
                                Age moyen: ${avgAge} ans<br>
                                Cancer dominant: ${mainCancer}
                            </div>
                        </div>
                    `, { direction: 'top', className: 'light-tooltip' });
                    
                    marker.addTo(professionLayerGroup);
                }
            });
        }

        function renderRiskZones() {
            drawnItems.clearLayers();
            if (!activeLayers.risk) return;

            zones.forEach(zone => {
                let layer;
                const style = { color: riskColors[zone.level], fillColor: riskColors[zone.level], fillOpacity: 0.3, weight: 2 };
                if (zone.shape.type === 'circle') layer = L.circle([zone.shape.lat, zone.shape.lng], { radius: zone.shape.radius, ...style });
                else if (zone.shape.type === 'rectangle') layer = L.rectangle(zone.shape.bounds, style);
                else layer = L.polygon(zone.shape.latlngs, style);
                
                layer.on('click', (e) => { L.DomEvent.stopPropagation(e); selectZone(zone.id); });
                layer.addTo(drawnItems);
                markers[zone.id] = layer;
            });
        }

        function renderCorrelations() {
            correlationLayerGroup.clearLayers();
            if (!activeLayers.fusion || !activeLayers.profession || selectedProfessions.length === 0) return;

            zones.forEach(zone => {
                const zonePos = zone.shape.type === 'circle' ? [zone.shape.lat, zone.shape.lng] : markers[zone.id].getBounds().getCenter();
                const linkedProfs = zone.linked_profs || [];

                selectedProfessions.forEach(prof => {
                    if (!linkedProfs.includes(prof)) return;

                    // Find clusters near this zone
                    for (const [w, coords] of Object.entries(WILAYA_COORDS)) {
                        const dist = map.distance(zonePos, coords) / 1000; // km
                        if (dist < 80) {
                            // Check if wilaya has patients with this profession
                            const count = patients.filter(p => p.wilaya === w && p.profession === prof).length;
                            if (count > 0) {
                                const color = PROFESSION_COLORS[prof] || '#64748b';
                                L.polyline([zonePos, coords], { color: color, weight: 2, dashArray: '5, 10', opacity: 0.6 }).addTo(correlationLayerGroup);
                            }
                        }
                    }
                });
            });
        }

        function onProfessionFilterChange() {
            const val = document.getElementById('f-profession').value;
            if (val === 'all') {
                selectedProfessions = [];
            } else if (!selectedProfessions.includes(val)) {
                selectedProfessions.push(val);
                activeLayers.profession = true;
                document.getElementById('layer-profession').classList.add('active');
            }
            renderProfessionPills();
            renderAll();
        }

        function renderProfessionPills() {
            const container = document.getElementById('selected-professions-pills');
            container.innerHTML = '';
            selectedProfessions.forEach(p => {
                const pill = document.createElement('div');
                pill.style = `background:#f1f5f9; border:1px solid #e2e8f0; padding:4px 10px; border-radius:14px; font-size:11px; font-weight:700; color:#475569; display:flex; align-items:center; gap:6px;`;
                pill.innerHTML = `${p} <i data-lucide="x" style="width:12px; height:12px; cursor:pointer" onclick="removeProfession('${p}')"></i>`;
                container.appendChild(pill);
            });
            lucide.createIcons();
        }

        function removeProfession(p) {
            selectedProfessions = selectedProfessions.filter(item => item !== p);
            renderProfessionPills();
            renderAll();
        }

        function toggleLayer(layer) {
            activeLayers[layer] = !activeLayers[layer];
            document.getElementById('layer-' + layer).classList.toggle('active');
            if (layer === 'fusion' && activeLayers.fusion) {
                activeLayers.profession = true;
                activeLayers.risk = true;
                document.getElementById('layer-profession').classList.add('active');
                document.getElementById('layer-risk').classList.add('active');
            }
            renderAll();
        }

        function setDrawMode(mode) {
            if (currentDrawMode === mode) mode = null;
            currentDrawMode = mode;
            document.querySelectorAll('.btn-draw').forEach(b => b.classList.remove('active'));
            if (mode) {
                document.getElementById('draw-' + mode).classList.add('active');
                document.getElementById('drawing-pill').classList.add('visible');
                let handler;
                if (mode === 'polygon') handler = new L.Draw.Polygon(map, drawControl.options.draw.polygon);
                else if (mode === 'rectangle') handler = new L.Draw.Rectangle(map, drawControl.options.draw.rectangle);
                else handler = new L.Draw.Circle(map, drawControl.options.draw.circle);
                handler.enable();
            } else {
                document.getElementById('drawing-pill').classList.remove('visible');
            }
        }

        function openZoneModal(shapeData, detectedWilaya) {
            lastShapeData = shapeData;
            document.getElementById('zone-modal').style.display = 'flex';
            document.getElementById('zone-details-form').reset();
            document.getElementById('edit-id').value = '';
            
            const wSelect = document.getElementById('z-wilaya');
            wSelect.innerHTML = '<option value="">Sélectionner...</option>';
            Object.keys(WILAYA_COORDS).sort().forEach(w => wSelect.add(new Option(w, w)));
            
            if (detectedWilaya) {
                wSelect.value = detectedWilaya;
                onWilayaChange(detectedWilaya);
            }
            lucide.createIcons();
        }

        async function onWilayaChange(wilaya) {
            const citySelect = document.getElementById('z-city');
            citySelect.innerHTML = '<option value="">Chargement...</option>';
            
            try {
                // Get real cities from patients
                const uniqueCities = [...new Set(patients.filter(p => p.wilaya === wilaya).map(p => p.commune || p.city).filter(Boolean))];
                const fallbacks = WILAYA_CITIES_FALLBACK[wilaya] || [];
                const finalCities = [...new Set([...uniqueCities, ...fallbacks])].sort();
                
                citySelect.innerHTML = '<option value="">Sélectionner Ville/Commune</option>';
                finalCities.forEach(c => citySelect.add(new Option(c, c)));
                citySelect.add(new Option("Autre (saisie libre)", "autre"));
            } catch (e) { citySelect.innerHTML = '<option value="">Erreur</option>'; }
        }

        function closeZoneModal() {
            document.getElementById('zone-modal').style.display = 'none';
            if (!document.getElementById('edit-id').value) {
                drawnItems.clearLayers();
                renderRiskZones();
            }
        }

        function handleZoneFormSubmit(e) {
            e.preventDefault();
            const isEdit = document.getElementById('edit-id').value;
            const linkedProfs = Array.from(document.querySelectorAll('input[name="linked_profs"]:checked')).map(i => i.value);
            
            const newZone = {
                id: isEdit ? isEdit : Date.now().toString(),
                name: document.getElementById('z-name').value,
                wilaya: document.getElementById('z-wilaya').value,
                city: document.getElementById('z-city').value,
                type: document.getElementById('z-type').value,
                level: document.getElementById('z-level').value,
                notes: document.getElementById('z-notes').value,
                linked_profs: linkedProfs,
                shape: isEdit ? zones.find(z => z.id === isEdit).shape : lastShapeData
            };

            if (isEdit) zones = zones.map(z => z.id === isEdit ? newZone : z);
            else zones.push(newZone);

            saveZones();
            closeZoneModal();
            renderAll();
            renderSidebarList();
        }

        function saveZones() { localStorage.setItem('sig_zones_v3', JSON.stringify(zones)); }
        function loadZones() { 
            const stored = localStorage.getItem('sig_zones_v3');
            if (stored) zones = JSON.parse(stored);
        }

        function updateSummary() {
            document.getElementById('count-cases').textContent = patients.length;
            document.getElementById('count-zones').textContent = zones.length;
        }

        function renderSidebarList() {
            const container = document.getElementById('zone-list-container');
            container.innerHTML = '';
            zones.forEach(zone => {
                const div = document.createElement('div');
                div.className = `zone-card ${zone.id === activeZoneId ? 'active' : ''}`;
                div.id = `card-${zone.id}`;
                div.onclick = () => selectZone(zone.id);
                div.innerHTML = `
                    <div class="zone-dot" style="background: ${riskColors[zone.level]}"></div>
                    <div class="zone-content">
                        <div class="zone-title">${zone.name}</div>
                        <div class="zone-loc">${zone.city}, ${zone.wilaya}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function selectZone(id) {
            activeZoneId = id;
            document.querySelectorAll('.zone-card').forEach(el => el.classList.remove('active'));
            if (!id) { document.getElementById('info-panel').classList.remove('visible'); return; }
            const card = document.getElementById('card-' + id);
            if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
            const zone = zones.find(z => z.id === id);
            if (zone) showInfoPanel(zone);
        }

        function showInfoPanel(zone) {
            const panel = document.getElementById('info-panel');
            document.getElementById('ip-title').textContent = zone.name;
            document.getElementById('ip-loc').textContent = `${zone.city}, ${zone.wilaya}`;
            document.getElementById('ip-badge').innerHTML = `<span class="badge badge-${zone.level}">${riskLabels[zone.level]}</span>`;
            document.getElementById('ip-notes').textContent = zone.notes || 'Aucune note.';
            
            const corr = document.getElementById('profession-correlations');
            corr.innerHTML = '';
            const linked = zone.linked_profs || [];
            linked.forEach(p => {
                // Calculate real count in nearby wilayas
                let count = patients.filter(pt => pt.wilaya === zone.wilaya && pt.profession === p).length;
                corr.innerHTML += `<div class="prof-item"><span>${p}</span><span class="prof-score">${count} patients</span></div>`;
            });

            panel.classList.add('visible');
            lucide.createIcons();
        }

        function deleteSelectedZone() {
            if (confirm('Supprimer cette zone ?')) {
                zones = zones.filter(z => z.id !== activeZoneId);
                saveZones();
                renderAll();
                renderSidebarList();
                document.getElementById('info-panel').classList.remove('visible');
            }
        }

        async function editSelectedZone() {
            const zone = zones.find(z => z.id === activeZoneId);
            if (!zone) return;
            
            // Re-open modal with existing shape
            openZoneModal(zone.shape, zone.wilaya);
            
            document.getElementById('edit-id').value = zone.id;
            document.getElementById('z-name').value = zone.name;
            document.getElementById('z-type').value = zone.type;
            document.getElementById('z-level').value = zone.level;
            document.getElementById('z-notes').value = zone.notes;
            
            // Wait for cities to load then set value
            await onWilayaChange(zone.wilaya);
            document.getElementById('z-city').value = zone.city;
            
            // Set checkboxes for linked profs
            const checks = document.querySelectorAll('input[name="linked_profs"]');
            checks.forEach(c => c.checked = (zone.linked_profs || []).includes(c.value));
        }

        function toggleSection(el) { el.classList.toggle('active'); el.nextElementSibling.classList.toggle('open'); }
        function hideProfessions() { activeLayers.profession = false; document.getElementById('layer-profession').classList.remove('active'); renderAll(); }
        function applyFilters() { renderAll(); }

        document.addEventListener('DOMContentLoaded', () => { initMap(); lucide.createIcons(); });
    </script>
